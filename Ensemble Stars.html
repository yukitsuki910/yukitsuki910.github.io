<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>偶像夢幻祭 偶像分團</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;900&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --bg:#ffffff;
    --card:#231a3d;
    --card-2:#2c2050;
    --gold:#ffc857;
    --magenta:#ff5da2;
    --cyan:#5eead4;

    /* 所有文字統一黑色 */
    --text:#000000;
    --muted:#000000;

    /* 線條顏色 */
    --line:rgba(0,0,0,.20);
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    padding:0;
  }

  body{
    min-height:100vh;

    background:
      radial-gradient(
        60vw 40vh at 15% -5%,
        rgba(255,93,162,.12),
        transparent 60%
      ),
      radial-gradient(
        50vw 40vh at 100% 0%,
        rgba(94,234,212,.10),
        transparent 55%
      ),
      linear-gradient(
        180deg,
        #ffffff,
        #ffffff 60%,
        #ffffff
      );

    color:var(--text);

    font-family:'Noto Sans TC',sans-serif;

    padding:24px 16px 100px;

    -webkit-user-select:none;
    user-select:none;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
  }


  /* =========================
     Header
     ========================= */

  header{
    text-align:center;
    margin-bottom:22px;
  }

  .eyebrow{
    font-family:'Baloo 2',sans-serif;
    letter-spacing:.35em;
    font-size:12px;
    color:#000000;
    text-transform:uppercase;
    margin-bottom:8px;
  }

  h1{
    font-weight:900;
    font-size:clamp(24px,5vw,38px);
    margin:0 0 10px;

    /* 原本的漸層文字取消 */
    color:#000000;

    line-height:1.3;
  }

  p.sub{
    color:#000000;
    font-size:14px;
    max-width:560px;
    margin:0 auto;
    line-height:1.7;
  }


  /* =========================
     Buttons
     ========================= */

  .controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:22px 0 30px;
    flex-wrap:wrap;
  }

  button{
    font-family:'Baloo 2',sans-serif;
    font-size:14px;
    font-weight:700;

    border:none;
    border-radius:999px;

    padding:11px 24px;

    cursor:pointer;

    transition:
      transform .15s ease,
      box-shadow .15s ease;
  }

  button:hover{
    transform:translateY(-2px);
  }


  /* 匯出 */

  #exportBtn{
    background:#ff5da2;
    color:#000000;

    box-shadow:
      0 6px 20px rgba(255,93,162,.25);
  }


  /* 重設 */

  #resetBtn{
    background:#ffffff;
    color:#000000;

    border:2px solid #000000;
  }


  /* 答案 */

  #answerBtn{
    background:#5eead4;
    color:#000000;

    box-shadow:
      0 6px 20px rgba(94,234,212,.25);
  }


  /* =========================
     Tier List
     ========================= */

  #tierlist{
    background:#ffffff;

    border-radius:18px;

    overflow:hidden;

    /*
      外框線
    */
    border:2px solid #000000;
  }


  .row{
    display:flex;

    min-height:78px;

    /*
      每一列的水平分隔線
    */
    border-bottom:2px solid #000000;
  }

  .row:last-child{
    border-bottom:none;
  }


  /* 左邊團體名稱 */

  .row-label{
    flex:0 0 96px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-family:'Baloo 2',sans-serif;

    font-weight:800;
    font-size:13px;
    line-height:1.3;

    color:#000000;

    padding:8px 6px;

    word-break:keep-word;

    /*
      左右區域中間的直線
    */
    border-right:2px solid #000000;
  }


  /* 右邊角色放置區 */

  .row-drop{
    flex:1;

    display:flex;
    flex-wrap:wrap;
    align-content:center;

    gap:8px;

    padding:8px;

    background:rgba(0,0,0,.02);

    min-height:78px;

    transition:
      background .12s ease;
  }

  .row-drop.hover{
    background:rgba(0,0,0,.08);
  }


  /* =========================
     Pool
     ========================= */

  .pool-section{
    margin-top:26px;
  }

  .section-label{
    font-family:'Baloo 2',sans-serif;

    font-size:13px;
    letter-spacing:.15em;

    color:#000000;

    text-transform:uppercase;

    margin-bottom:10px;

    display:flex;
    align-items:center;
    gap:8px;
  }

  .section-label::before{
    content:"";

    width:18px;
    height:2px;

    background:#000000;

    display:inline-block;
  }


  #pool{
    display:flex;
    flex-wrap:wrap;

    gap:10px;

    background:rgba(0,0,0,.02);

    /*
      偶像池外框
    */
    border:2px dashed rgba(0,0,0,.35);

    border-radius:18px;

    padding:16px;

    min-height:90px;

    transition:
      background .12s ease;
  }

  #pool.hover{
    background:rgba(0,0,0,.08);
  }


  /* =========================
     Idol Item
     ========================= */

  .item{
    width:58px;
    height:58px;

    border-radius:50%;

    overflow:hidden;

    border:2px solid rgba(0,0,0,.25);

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    cursor:grab;

    touch-action:none;

    flex-shrink:0;
  }

  .item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    pointer-events:none;
  }


  .item.dragging{
    position:fixed;

    z-index:999;

    box-shadow:
      0 10px 30px rgba(0,0,0,.35),
      0 0 0 3px #ffc857;

    cursor:grabbing;

    opacity:.95;
  }


  /* =========================
     Footer
     ========================= */

  footer{
    text-align:center;

    color:#000000;

    font-size:12px;

    margin-top:30px;
  }
</style>
</head>


<body>

<div class="wrap">

  <header>

    <div class="eyebrow">
      Idol Unit Tier Maker
    </div>

    <h1>
      偶像分團 Tier Maker
    </h1>

    <p class="sub">
      把下面池子裡的偶像拖到你覺得對的團體那一列，
      排完可以直接匯出成一張圖片分享出去，
      沒有正確答案、單純好玩。
    </p>

  </header>


  <!-- =========================
       Buttons
       ========================= -->

  <div class="controls">

    <button id="exportBtn">
      匯出成 PNG
    </button>

    <button id="resetBtn">
      全部重設
    </button>

    <button id="answerBtn">
      查看答案
    </button>

  </div>


  <!-- Tier List -->

  <div id="tierlist"></div>


  <!-- Idol Pool -->

  <div class="pool-section">

    <div class="section-label">
      偶像池
    </div>

    <div id="pool"></div>

  </div>


  <footer>
    拖曳排列
  </footer>

</div>


<script>

/* =========================================================================
   資料設定區
   ========================================================================= */

  {name:"Trickstar (4)",               color:"#ff8a5c"},
  {name:"流星隊 (5)",                  color:"#ff5da2"},
  {name:"ALKALOID (4)",                color:"#c084fc"},
  {name:"Eden (4)",                    color:"#8ec5ff"},
  {name:"Valkyrie (2)",                color:"#a3a3ff"},
  {name:"2wink (2)",                   color:"#5eead4"},
  {name:"Crazy:B (4)",                 color:"#ffd166"},
  {name:"UNDEAD (4)",                  color:"#b0b0c8"},
  {name:"Ra*bits (5)",                 color:"#ffb3c6"},
  {name:"紅月 (4)",                    color:"#ff6b6b"},
  {name:"Knights (4)",                 color:"#7ea8ff"},
  {name:"Switch (3)",                  color:"#c9f299"},
  {name:"MaM (1)",                     color:"#ffa45c"},
  {name:"Special for Princess! (4)",   color:"#ff9de2"},
  {name:"MELLOW DEAR US (4)",          color:"#caa06a"},
  {name:"double face (2)",             color:"#6bd3c7"},

const IDOLS = [

  {id:"eichi",   img:"images2/Eichi_ES_Head.webp"},
  {id:"wataru",  img:"images2/Wataru_ES_Head.webp"},
  {id:"momo",    img:"images2/Momo_ES_Head.webp"},
  {id:"yuzuru",  img:"images2/Yuzuru_ES_Head.webp"},

  {id:"hokuto",  img:"images2/Hokuto_ES_Head.webp"},
  {id:"subaru",  img:"images2/Subaru_ES_Head.webp"},
  {id:"makoto",  img:"images2/Makoto_ES_Head.webp"},
  {id:"mao",     img:"images2/Mao_ES_Head.webp"},

  {id:"chiaki",  img:"images2/Chiaki_ES_Head.webp"},
  {id:"kanata",  img:"images2/Kanata_ES_Head.webp"},
  {id:"tetora",  img:"images2/Tetora_ES_Head.webp"},
  {id:"midori",  img:"images2/Midori_ES_Head.webp"},
  {id:"shinobu", img:"images2/Shinobu_ES_Head.webp"},

  {id:"mayoi",   img:"images2/Mayoi_ES_Head.webp"},

  {id:"tsubasa", img:"images2/Tsubasa_ES_Head.webp"},
  {id:"nagi",    img:"images2/Nagi_ES_Head.webp"},

  {id:"shu",     img:"images2/Shu_ES_Head.webp"},
  {id:"mika",    img:"images2/Mika_ES_Head.webp"},

  {id:"hinata",  img:"images2/Hinata_ES_Head.webp"},
  {id:"yuta",    img:"images2/Yuta_ES_Head.webp"},

  {id:"rinne",   img:"images2/Rinne_ES_Head.webp"},

  {id:"rei",     img:"images2/Rei_ES_Head.webp"},
  {id:"kaoru",   img:"images2/Kaoru_ES_Head.webp"},
  {id:"koga",    img:"images2/Koga_ES_Head.webp"},
  {id:"adonis",  img:"images2/Adonis_ES_Head.webp"},

  {id:"narumi",  img:"images2/Narumi_ES_Head.webp"},

  {id:"hajime",  img:"images2/Hajime_ES_Head.webp"},

  {id:"keito",   img:"images2/Keito_ES_Head.webp"},
  {id:"kurou",   img:"images2/Kurou._ES_Head.webp"},
  {id:"souma",   img:"images2/Souma_ES_Head.webp"},

  {id:"ibuki",   img:"images2/Ibuki_ES_Head.webp"},

  {id:"tsukasa", img:"images2/Tsukasa_ES_Head.webp"},
  {id:"leo",     img:"images2/Leo_ES_Head.webp"},
  {id:"izumi",   img:"images2/Izumi_ES_Head.webp"},
  {id:"ritsu",   img:"images2/Ritsu_ES_Head.webp"},
  {id:"arashi",  img:"images2/Arashi_ES_Head.webp"},

  {id:"natsume", img:"images2/Natsume_ES_Head.webp"},
  {id:"tsumugi", img:"images2/Tsumugi_ES_Head.webp"},
  {id:"hiro",    img:"images2/Hiro_ES_Head.webp"},

  {id:"madara",  img:"images2/Madara_ES_Head.webp"},

  {id:"esu",     img:"images/Esu_ES_Head.webp"},
  {id:"kanna",   img:"images/Kanna_ES_Head.webp"},
  {id:"juice",   img:"images/Juice_ES_Head.webp"},
  {id:"nozomi",  img:"images/Nozomi_ES_Head.webp"},
  {id:"maju",    img:"images/Maju_ES_Head.webp"},
  {id:"chitose", img:"images/Chitose_ES_Head.webp"},

];


/* =========================================================================
   基本設定
   ========================================================================= */

const tierlistEl = document.getElementById("tierlist");
const poolEl = document.getElementById("pool");


/* =========================
   隨機排序
   ========================= */

function shuffle(arr){

  const a = arr.slice();

  for(let i = a.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];

  }

  return a;
}


/* =========================
   建立 Tier Rows
   ========================= */

function buildRows(){

  tierlistEl.innerHTML = "";

  GROUPS.forEach(g => {

    const row = document.createElement("div");

    row.className = "row";

    row.innerHTML = `
      <div
        class="row-label"
        style="background:${g.color}"
      >
        ${g.name}
      </div>

      <div
        class="row-drop"
        data-drop="row"
      ></div>
    `;

    tierlistEl.appendChild(row);

  });

}


/* =========================
   建立偶像池
   ========================= */

function buildPool(){

  poolEl.innerHTML = "";

  shuffle(IDOLS).forEach(idol => {

    const el = document.createElement("div");

    el.className = "item";

    el.dataset.id = idol.id;

    el.innerHTML = `
      <img
        src="${idol.img}"
        alt="${idol.id}"
        onerror="
          this.replaceWith(
            Object.assign(
              document.createElement('div'),
              {textContent:'🎤'}
            )
          )
        "
      >
    `;

    poolEl.appendChild(el);

    makeDraggable(el);

  });

}


/* =========================================================================
   Drag Logic
   ========================================================================= */

function getDropZones(){

  return [
    ...document.querySelectorAll(".row-drop"),
    poolEl
  ];

}


function makeDraggable(el){

  let offsetX = 0;
  let offsetY = 0;

  let startParent = null;
  let placeholder = null;


  el.addEventListener("pointerdown", (e) => {

    e.preventDefault();

    const rect = el.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    startParent = el.parentElement;


    /* Placeholder */

    placeholder = document.createElement("div");

    placeholder.style.width = rect.width + "px";
    placeholder.style.height = rect.height + "px";
    placeholder.style.flexShrink = "0";

    startParent.insertBefore(
      placeholder,
      el
    );


    /* 拖曳中的元素 */

    el.style.width = rect.width + "px";
    el.style.height = rect.height + "px";

    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";

    el.classList.add("dragging");

    document.body.appendChild(el);


    el.setPointerCapture(e.pointerId);


    /* =========================
       Move
       ========================= */

    function onMove(ev){

      el.style.left =
        (ev.clientX - offsetX) + "px";

      el.style.top =
        (ev.clientY - offsetY) + "px";


      el.style.visibility = "hidden";

      const under =
        document.elementFromPoint(
          ev.clientX,
          ev.clientY
        );

      el.style.visibility = "visible";


      const zone =
        under
          ? under.closest(".row-drop, #pool")
          : null;


      getDropZones().forEach(z =>
        z.classList.remove("hover")
      );


      if(zone){

        zone.classList.add("hover");

      }

    }


    /* =========================
       Drop
       ========================= */

    function onUp(ev){

      el.releasePointerCapture(
        ev.pointerId
      );

      el.removeEventListener(
        "pointermove",
        onMove
      );

      el.removeEventListener(
        "pointerup",
        onUp
      );

      el.removeEventListener(
        "pointercancel",
        onUp
      );


      el.style.visibility = "hidden";

      const under =
        document.elementFromPoint(
          ev.clientX,
          ev.clientY
        );

      el.style.visibility = "visible";


      const zone =
        under
          ? under.closest(".row-drop, #pool")
          : null;


      getDropZones().forEach(z =>
        z.classList.remove("hover")
      );


      el.classList.remove("dragging");

      el.style.position = "";
      el.style.left = "";
      el.style.top = "";
      el.style.width = "";
      el.style.height = "";


      if(zone){

        zone.appendChild(el);

      }else{

        startParent.insertBefore(
          el,
          placeholder
        );

      }


      placeholder.remove();

    }


    el.addEventListener(
      "pointermove",
      onMove
    );

    el.addEventListener(
      "pointerup",
      onUp
    );

    el.addEventListener(
      "pointercancel",
      onUp
    );

  });

}


/* =========================================================================
   匯出 PNG
   ========================================================================= */

document
  .getElementById("exportBtn")
  .addEventListener("click", async () => {

    const btn =
      document.getElementById("exportBtn");

    const originalText =
      btn.textContent;

    btn.textContent =
      "產生圖片中…";

    btn.disabled = true;


    try{

      const canvas =
        await html2canvas(tierlistEl, {

          backgroundColor:"#ffffff",

          scale:2,

          useCORS:true,

        });


      const link =
        document.createElement("a");

      link.download =
        "idol-tierlist.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();


    }catch(err){

      alert(
        "匯出失敗，可能是圖片沒放對路徑或跨網域問題："
        + err.message
      );


    }finally{

      btn.textContent =
        originalText;

      btn.disabled = false;

    }

  });


/* =========================================================================
   重設
   ========================================================================= */

document
  .getElementById("resetBtn")
  .addEventListener("click", () => {

    buildPool();

  });


/* =========================================================================
   查看答案
   -------------------------------------------------------------------------
   只要把你的答案圖片放到：

   images/answer.png

   就可以。

   如果你想換檔名，只需要改下面的路徑。
   ========================================================================= */

document
  .getElementById("answerBtn")
  .addEventListener("click", () => {

    window.open(
      "images/answer.png",
      "_blank"
    );

  });


/* =========================================================================
   啟動
   ========================================================================= */

buildRows();

buildPool();

</script>

</body>
</html>
