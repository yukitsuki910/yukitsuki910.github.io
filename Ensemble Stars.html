/* =========================================================
   基本
   ========================================================= */

:root{
  --text:#000000;
  --line:#000000;
  --bg:#ffffff;
  --gray:#eeeeee;
  --pink:#ff5da2;
  --cyan:#5eead4;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  background:#ffffff;

  color:#000000;

  font-family:'Noto Sans TC',sans-serif;

  padding:24px 16px 100px;

  -webkit-user-select:none;
  user-select:none;
}

.wrap{
  max-width:1080px;
  margin:0 auto;
}



/* =========================================================
   標題
   ========================================================= */

header{
  text-align:center;
  margin-bottom:22px;
}

.eyebrow{
  font-family:'Baloo 2',sans-serif;
  letter-spacing:.35em;
  font-size:12px;

  color:#000000;

  text-transform:uppercase;

  margin-bottom:8px;
}

h1{
  font-weight:900;
  font-size:clamp(24px,5vw,38px);

  margin:0 0 10px;

  color:#000000;

  line-height:1.3;
}

p.sub{
  color:#000000;

  font-size:14px;

  max-width:620px;

  margin:0 auto;

  line-height:1.7;
}



/* =========================================================
   按鈕
   ========================================================= */

.controls{
  display:flex;

  justify-content:center;

  gap:12px;

  margin:22px 0 30px;

  flex-wrap:wrap;
}

button{
  font-family:'Baloo 2',sans-serif;

  font-size:14px;

  font-weight:700;

  border:none;

  border-radius:999px;

  padding:11px 24px;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  opacity:.5;

  cursor:not-allowed;

  transform:none;
}

#exportBtn{
  background:#ff5da2;
  color:#000000;
}

#resetBtn{
  background:#ffffff;
  color:#000000;

  border:2px solid #000000;
}

#answerBtn{
  background:#5eead4;
  color:#000000;
}



/* =========================================================
   Tier List
   ========================================================= */

#tierlist{

  background:#ffffff;

  border:2px solid #000000;

  border-radius:18px;

  overflow:hidden;
}

.row{

  display:flex;

  min-height:78px;

  border-bottom:2px solid #000000;
}

.row:last-child{
  border-bottom:none;
}



/* =========================================================
   團體名稱
   ========================================================= */

.row-label{

  flex:0 0 110px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  font-family:'Baloo 2',sans-serif;

  font-weight:800;

  font-size:13px;

  line-height:1.3;

  color:#000000;

  padding:8px 6px;

  word-break:keep-all;

  border-right:2px solid #000000;
}



/* =========================================================
   Tier 角色區

   不拖曳。
   點擊空白區開啟選角視窗。
   ========================================================= */

.row-drop{

  flex:1;

  display:flex;

  flex-wrap:wrap;

  align-content:center;

  align-items:center;

  gap:8px;

  padding:8px;

  background:#ffffff;

  min-height:78px;

  cursor:pointer;

  transition:background .12s ease;
}

.row-drop:hover{
  background:#f3f3f3;
}



/* =========================================================
   Tier 裡的角色
   ========================================================= */

.tier-item{

  width:58px;

  height:58px;

  border-radius:50%;

  overflow:hidden;

  border:2px solid rgba(0,0,0,.25);

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  cursor:pointer;

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.tier-item img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  pointer-events:none;
}

.tier-item:hover{

  transform:scale(1.06);

  box-shadow:
    0 0 0 3px #ff5da2;
}



/* =========================================================
   下方「偶像池預覽」

   注意：
   這裡只有一個池。

   不能點選、不能拖曳。

   只是讓玩家查看所有角色＋名字。
   ========================================================= */

.pool-section{

  margin-top:28px;
}

.section-label{

  font-family:'Baloo 2',sans-serif;

  font-size:13px;

  letter-spacing:.15em;

  color:#000000;

  text-transform:uppercase;

  margin-bottom:10px;

  display:flex;

  align-items:center;

  gap:8px;
}

.section-label::before{

  content:"";

  width:18px;

  height:2px;

  background:#000000;

  display:inline-block;
}

.preview-pool{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(74px,1fr));

  gap:14px;

  background:#ffffff;

  border:2px dashed rgba(0,0,0,.4);

  border-radius:18px;

  padding:16px;
}



/* =========================================================
   預覽角色
   ========================================================= */

.preview-item{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:5px;

  min-width:0;

}

.preview-image{

  width:58px;

  height:58px;

  border-radius:50%;

  overflow:hidden;

  border:2px solid rgba(0,0,0,.25);

  background:#ffffff;

}

.preview-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;
}

.preview-name{

  color:#000000;

  font-size:10px;

  line-height:1.3;

  text-align:center;

  word-break:break-all;
}



/* =========================================================
   角色選擇 Modal
   ========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:2000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:16px;

  background:rgba(0,0,0,.65);
}

.modal.open{
  display:flex;
}

.modal-box{

  width:min(900px,100%);

  max-height:92vh;

  background:#ffffff;

  border:2px solid #000000;

  border-radius:20px;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  box-shadow:
    0 20px 60px rgba(0,0,0,.4);
}



/* =========================================================
   Modal Header
   ========================================================= */

.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:15px 18px;

  border-bottom:2px solid #000000;
}

.modal-title{

  margin:0;

  font-size:18px;

  font-weight:900;

  color:#000000;
}

.modal-close{

  width:38px;

  height:38px;

  padding:0;

  border-radius:50%;

  background:#ffffff;

  color:#000000;

  border:2px solid #000000;

  font-size:20px;

  line-height:1;

  display:flex;

  align-items:center;

  justify-content:center;
}

.modal-close:hover{

  background:#eeeeee;

  transform:none;
}



/* =========================================================
   Modal 的池子標籤

   這裡才有：

   偶像池 1 | 偶像池 2
   ========================================================= */

.modal-tabs{

  display:flex;

  border-bottom:2px solid #000000;

  background:#ffffff;
}

.modal-tab{

  flex:1;

  border:none;

  border-radius:0;

  background:#ffffff;

  color:#000000;

  padding:11px 16px;

  font-family:'Baloo 2',sans-serif;

  font-size:14px;

  font-weight:800;

  cursor:pointer;

  transform:none !important;
}

.modal-tab + .modal-tab{

  border-left:2px solid #000000;
}

.modal-tab.active{

  background:#000000;

  color:#ffffff;
}



/* =========================================================
   Modal 內容
   ========================================================= */

.modal-body{

  overflow-y:auto;

  padding:16px;
}

.character-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(72px,1fr));

  gap:12px;
}



/* =========================================================
   Modal 角色
   ========================================================= */

.character-option{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:5px;

  cursor:pointer;

  min-width:0;
}

.character-image{

  width:64px;

  height:64px;

  border-radius:50%;

  overflow:hidden;

  border:2px solid rgba(0,0,0,.25);

  background:#ffffff;

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.character-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;
}

.character-option:hover .character-image{

  transform:scale(1.08);

  box-shadow:
    0 0 0 3px #ff5da2;
}

.character-option.used{

  opacity:.25;

  cursor:not-allowed;
}

.character-option.used:hover .character-image{

  transform:none;

  box-shadow:none;
}

.character-name{

  color:#000000;

  font-size:10px;

  font-weight:600;

  text-align:center;

  word-break:break-all;

  line-height:1.3;
}



/* =========================================================
   Modal 提示
   ========================================================= */

.modal-note{

  text-align:center;

  font-size:11px;

  color:#000000;

  padding:0 16px 12px;
}



/* =========================================================
   Footer
   ========================================================= */

footer{

  text-align:center;

  color:#000000;

  font-size:12px;

  margin-top:30px;
}



/* =========================================================
   手機版
   ========================================================= */

@media(max-width:600px){

  body{
    padding:16px 8px 70px;
  }

  .row-label{

    flex:0 0 82px;

    font-size:11px;
  }

  .tier-item{

    width:50px;

    height:50px;
  }

  .preview-pool{

    grid-template-columns:
      repeat(auto-fill,minmax(62px,1fr));

    gap:11px;

    padding:12px;
  }

  .preview-image{

    width:52px;

    height:52px;
  }

  .character-grid{

    grid-template-columns:
      repeat(auto-fill,minmax(62px,1fr));

    gap:10px;
  }

  .character-image{

    width:56px;

    height:56px;
  }

  button{

    padding:9px 18px;

    font-size:13px;
  }

  .modal{

    padding:8px;
  }

  .modal-box{

    max-height:95vh;
  }

}

</style>

   ========================================================= */

function buildRows(){

  tierlistEl.innerHTML = "";


  GROUPS.forEach(
    (group,index) => {

      const row =
        document.createElement("div");

      row.className =
        "row";


      row.innerHTML = `

        <div
          class="row-label"
          style="background:${group.color}"
        >
          ${group.name}
        </div>

        <div
          class="row-drop"
          data-row-index="${index}"
        ></div>

      `;


      const drop =
        row.querySelector(
          ".row-drop"
        );


      /*
         點擊 Tier 區域
         開啟角色選擇
      */

      drop.addEventListener(
        "click",
        function(e){

          /*
             如果點到角色，
             角色自己會處理移除。
          */

          if(
            e.target.closest(
              ".tier-item"
            )
          ){

            return;

          }


          openModal(
            drop,
            group.name
          );

        }
      );


      tierlistEl.appendChild(
        row
      );

    }
  );

}



/* =========================================================
   建立下方預覽池
   ========================================================= */

function buildPreviewPool(){

  previewPoolEl.innerHTML = "";


  IDOLS.forEach(
    idol => {

      const item =
        document.createElement("div");

      item.className =
        "preview-item";


      item.innerHTML = `

        <div class="preview-image">

          <img
            src="${idol.img}"
            alt="${idol.name}"
            onerror="
              this.replaceWith(
                Object.assign(
                  document.createElement('div'),
                  {
                    textContent:'🎤',
                    style:'font-size:22px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;'
                  }
                )
              )
            "
          >

        </div>

        <div class="preview-name">
          ${idol.name}
        </div>

      `;


      /*
         預覽池完全不能互動
      */

      previewPoolEl.appendChild(
        item
      );

    }
  );

}



/* =========================================================
   開啟 Modal
   ========================================================= */

function openModal(
  row,
  groupName
){

  currentRow = row;


  modalTitle.textContent =
    "選擇偶像 → " + groupName;


  renderCharacters();


  modal.classList.add(
    "open"
  );


  document.body.style.overflow =
    "hidden";

}



/* =========================================================
   關閉 Modal
   ========================================================= */

function closeModal(){

  modal.classList.remove(
    "open"
  );


  currentRow = null;


  document.body.style.overflow =
    "";

}



/* =========================================================
   切換 Modal 裡的偶像池
   ========================================================= */

document
  .querySelectorAll(
    ".modal-tab"
  )
  .forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        activePool =
          tab.dataset.pool;


        document
          .querySelectorAll(
            ".modal-tab"
          )
          .forEach(t => {

            t.classList.remove(
              "active"
            );

          });


        tab.classList.add(
          "active"
        );


        renderCharacters();

      }
    );

  });



/* =========================================================
   顯示角色
   ========================================================= */

function renderCharacters(){

  characterGrid.innerHTML = "";


  let available = 0;


  IDOLS.forEach(
    idol => {

      const option =
        document.createElement(
          "div"
        );


      option.className =
        "character-option";


      /*
         池 1：
         已經使用過 → disabled

         池 2：
         全部都能使用
      */

      const used =
        activePool === "pool1" &&
        usedPool1.has(
          idol.id
        );


      if(used){

        option.classList.add(
          "used"
        );

      }
      else{

        available++;

      }


      option.innerHTML = `

        <div class="character-image">

          <img
            src="${idol.img}"
            alt="${idol.name}"
            onerror="
              this.replaceWith(
                Object.assign(
                  document.createElement('div'),
                  {
                    textContent:'🎤',
                    style:'font-size:24px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;'
                  }
                )
              )
            "
          >

        </div>

        <div class="character-name">
          ${idol.name}
        </div>

      `;


      if(!used){

        option.addEventListener(
          "click",
          () => {

            addCharacter(
              currentRow,
              idol,
              activePool
            );

          }
        );

      }


      characterGrid.appendChild(
        option
      );

    }
  );


  if(
    available === 0
  ){

    characterGrid.innerHTML = `

      <div
        class="no-character"
        style="
          grid-column:1/-1;
          text-align:center;
          padding:40px 10px;
          color:#000000;
        "
      >

        偶像池 1 已經全部使用完畢。

      </div>

    `;

  }

}



/* =========================================================
   加入角色
   ========================================================= */

function addCharacter(
  row,
  idol,
  pool
){

  if(!row){

    return;

  }


  /*
     池 1 防止重複
  */

  if(
    pool === "pool1" &&
    usedPool1.has(
      idol.id
    )
  ){

    return;

  }


  /*
     建立 Tier 角色
  */

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "tier-item";


  item.dataset.id =
    idol.id;


  item.dataset.pool =
    pool;


  item.innerHTML = `

    <img
      src="${idol.img}"
      alt="${idol.name}"
      title="點擊移除 ${idol.name}"
      onerror="
        this.replaceWith(
          Object.assign(
            document.createElement('div'),
            {
              textContent:'🎤',
              style:'font-size:22px'
            }
          )
        )
      "
    >

  `;


  /*
     點角色 → 移除
  */

  item.addEventListener(
    "click",
    function(e){

      e.stopPropagation();


      removeCharacter(
        item,
        idol,
        pool
      );

    }
  );


  row.appendChild(
    item
  );


  /*
     池 1 記錄使用
  */

  if(
    pool === "pool1"
  ){

    usedPool1.add(
      idol.id
    );

  }


  closeModal();

}



/* =========================================================
   移除角色
   ========================================================= */

function removeCharacter(
  item,
  idol,
  pool
){

  item.remove();


  /*
     如果是池 1，
     移除後重新變成可選
  */

  if(
    pool === "pool1"
  ){

    usedPool1.delete(
      idol.id
    );

  }

}



/* =========================================================
   關閉按鈕
   ========================================================= */

document
  .getElementById(
    "modalClose"
  )
  .addEventListener(
    "click",
    closeModal
  );



/*
   點擊背景關閉
*/

modal.addEventListener(
  "click",
  function(e){

    if(
      e.target === modal
    ){

      closeModal();

    }

  }
);



/*
   ESC
*/

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Escape"
    ){

      closeModal();

    }

  }
);



/* =========================================================
   全部重設
   ========================================================= */

document
  .getElementById(
    "resetBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(
        !confirm(
          "確定要清空所有已放入的偶像嗎？"
        )
      ){

        return;

      }


      document
        .querySelectorAll(
          ".row-drop"
        )
        .forEach(
          row => {

            row.innerHTML = "";

          }
        );


      usedPool1.clear();

    }
  );



/* =========================================================
   匯出 PNG
   ========================================================= */

document
  .getElementById(
    "exportBtn"
  )
  .addEventListener(
    "click",
    async function(){

      const btn =
        document.getElementById(
          "exportBtn"
        );


      const originalText =
        btn.textContent;


      btn.textContent =
        "產生圖片中…";


      btn.disabled =
        true;


      try{

        const canvas =
          await html2canvas(
            tierlistEl,
            {

              backgroundColor:
                "#ffffff",

              scale:2,

              useCORS:true,

              logging:false

            }
          );


        const link =
          document.createElement(
            "a"
          );


        link.download =
          "idol-tierlist.png";


        link.href =
          canvas.toDataURL(
            "image/png"
          );


        link.click();

      }

      catch(error){

        alert(
          "匯出失敗："
          + error.message
        );

      }

      finally{

        btn.textContent =
          originalText;


        btn.disabled =
          false;

      }

    }
  );



/* =========================================================
   答案
   ========================================================= */

document
  .getElementById(
    "answerBtn"
  )
  .addEventListener(
    "click",
    function(){

      window.open(
        "images2/answer.png",
        "_blank"
      );

    }
  );



/* =========================================================
   初始化
   ========================================================= */

buildRows();

buildPreviewPool();

</script>


</body>

</html>
