/* =========================================================

const tierlistEl =
  document.getElementById("tierlist");


const poolEl =

const pool2El =
  document.getElementById("pool2");



/* =========================================================
   隨機排序
   ========================================================= */

function shuffle(arr){

  const a = arr.slice();

  for(
    let i = a.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      a[i],
      a[j]
    ] = [
      a[j],
      a[i]
    ];

  }

  return a;

}



/* =========================================================
   建立 Tier
   ========================================================= */

function buildRows(){

  tierlistEl.innerHTML = "";


  GROUPS.forEach(g => {

    const row =
      document.createElement("div");


    row.className = "row";


    row.innerHTML = `

      <div
        class="row-label"
        style="background:${g.color}"
      >

        ${g.name}

      </div>


      <div
        class="row-drop"
        data-drop="row"
      ></div>

    `;


    tierlistEl.appendChild(row);

  });

}



/* =========================================================
   建立角色卡
   ========================================================= */

function createItem(idol){

  const el =
    document.createElement("div");


  el.className = "item";


  el.dataset.id =
    idol.id;


  el.innerHTML = `

    <img
      src="${idol.img}"
      alt="${idol.id}"
      onerror="
        this.replaceWith(
          Object.assign(
            document.createElement('div'),
            {
              textContent:'🎤'
            }
          )
        )
      "
    >

  `;


  makeDraggable(el);


  return el;

}



/* =========================================================
   建立偶像池
   ========================================================= */

function buildPool(){

  poolEl.innerHTML = "";


  shuffle(IDOLS).forEach(idol => {

    poolEl.appendChild(
      createItem(idol)
    );

  });

}



/* =========================================================

function buildPool2(){

}



/* =========================================================
   找出所有可以放角色的區域
   ========================================================= */

function getDropZones(){

  return [

    ...document.querySelectorAll(
      ".row-drop"
    ),

    poolEl,

    pool2El

  ];

}



/* =========================================================
   拖曳系統
   ========================================================= */

function makeDraggable(el){

  let offsetX = 0;

  let offsetY = 0;

  let startParent = null;

  let placeholder = null;


  el.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();


      const rect =
        el.getBoundingClientRect();


      offsetX =
        e.clientX - rect.left;


      offsetY =
        e.clientY - rect.top;


      startParent =
        el.parentElement;



      /* 建立佔位 */

      placeholder =
        document.createElement("div");


      placeholder.style.width =
        rect.width + "px";


      placeholder.style.height =
        rect.height + "px";


      placeholder.style.flexShrink =
        "0";


      startParent.insertBefore(
        placeholder,
        el
      );



      /* 變成浮動拖曳 */

      el.style.width =
        rect.width + "px";


      el.style.height =
        rect.height + "px";


      el.style.left =
        rect.left + "px";


      el.style.top =
        rect.top + "px";


      el.classList.add(
        "dragging"
      );


      document.body.appendChild(
        el
      );


      el.setPointerCapture(
        e.pointerId
      );



      /* =================================================
         移動
         ================================================= */

      function onMove(ev){

        el.style.left =
          (
            ev.clientX - offsetX
          ) + "px";


        el.style.top =
          (
            ev.clientY - offsetY
          ) + "px";


        el.style.visibility =
          "hidden";


        const under =
          document.elementFromPoint(
            ev.clientX,
            ev.clientY
          );


        el.style.visibility =
          "visible";


        const zone =
          under
            ? under.closest(
                ".row-drop, #pool, #pool2"
              )
            : null;



        getDropZones().forEach(z => {

          z.classList.remove(
            "hover"
          );

        });



        if(zone){

          zone.classList.add(
            "hover"
          );

        }

      }



      /* =================================================
         放下
         ================================================= */

      function onUp(ev){

        el.releasePointerCapture(
          ev.pointerId
        );


        el.removeEventListener(
          "pointermove",
          onMove
        );


        el.removeEventListener(
          "pointerup",
          onUp
        );


        el.removeEventListener(
          "pointercancel",
          onUp
        );


        el.style.visibility =
          "hidden";


        const under =
          document.elementFromPoint(
            ev.clientX,
            ev.clientY
          );


        el.style.visibility =
          "visible";


        const zone =
          under
            ? under.closest(
                ".row-drop, #pool, #pool2"
              )
            : null;
                getDropZones().forEach(z => {

          z.classList.remove(
            "hover"
          );

        });



        el.classList.remove(
          "dragging"
        );


        el.style.position =
          "";


        el.style.left =
          "";


        el.style.top =
          "";


        el.style.width =
          "";


        el.style.height =
          "";



        if(zone){

          zone.appendChild(
            el
          );

        }
        else{

          startParent.insertBefore(
            el,
            placeholder
          );

        }


        placeholder.remove();

      }



      el.addEventListener(
        "pointermove",
        onMove
      );


      el.addEventListener(
        "pointerup",
        onUp
      );


      el.addEventListener(
        "pointercancel",
        onUp
      );

    }

  );

}



/* =========================================================
   匯出 PNG
   ========================================================= */

document
  .getElementById("exportBtn")
  .addEventListener(
    "click",
    async () => {

      const btn =
        document.getElementById(
          "exportBtn"
        );


      const originalText =
        btn.textContent;


      btn.textContent =
        "產生圖片中…";


      btn.disabled = true;



      try{

        const canvas =
          await html2canvas(
            tierlistEl,
            {

              backgroundColor:
                "#ffffff",

              scale:2,

              useCORS:true

            }
          );



        const link =
          document.createElement(
            "a"
          );


        link.download =
          "idol-tierlist.png";


        link.href =
          canvas.toDataURL(
            "image/png"
          );


        link.click();

      }


      catch(err){

        alert(
          "匯出失敗："
          + err.message
        );

      }


      finally{

        btn.textContent =
          originalText;


        btn.disabled = false;

      }

    }
  );
